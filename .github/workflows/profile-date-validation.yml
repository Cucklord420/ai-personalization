name: Profile validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: profile-validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Generate dependency lock for this test run
        run: cargo generate-lockfile --manifest-path validation/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path validation/Cargo.toml -- --check
      - name: Run regression tests
        run: cargo test --manifest-path validation/Cargo.toml
      - name: Emit temporary lockfile for review
        if: always()
        run: cat validation/Cargo.lock
