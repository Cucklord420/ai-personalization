name: Profile date validation

on:
  pull_request:
    branches: [main]
    paths:
      - "profile.json"
      - "schema/profile.schema.json"
      - "validation/profile-date.test.mjs"
      - ".github/workflows/profile-date-validation.yml"
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "schema/profile.schema.json"
      - "validation/profile-date.test.mjs"
      - ".github/workflows/profile-date-validation.yml"

permissions:
  contents: read

jobs:
  calendar-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Run calendar date regression tests
        run: node --test validation/profile-date.test.mjs
